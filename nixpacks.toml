[phases.setup]
nixPkgs = ["php84", "php84Packages.composer"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build",
    "mkdir -p /app/.config/php && printf 'upload_max_filesize = 10M\\npost_max_size = 12M\\nmemory_limit = 256M\\n' > /app/.config/php/uploads.ini"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=TagSeeder --force && php artisan db:seed --class=DemoDataSeeder --force && php artisan config:cache && php artisan route:cache && php -d upload_max_filesize=10M -d post_max_size=12M -d memory_limit=256M artisan serve --host=0.0.0.0 --port=$PORT"
